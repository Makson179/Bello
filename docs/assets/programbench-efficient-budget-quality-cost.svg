<title id="programbench-efficient-budget-quality-cost-title">Budget: 66.3% less weekly-limit usage, with average quality preserved</title>
<desc id="programbench-efficient-budget-quality-cost-desc">Revive: score 40.990 to 45.530%; weekly-limit use 3.2757 to 1.0555%; JSON Schema: score 56.821 to 54.673%; weekly-limit use 3.0069 to 0.8138%; Lightning CSS: score 60.750 to 60.302%; weekly-limit use 6.0281 to 2.2569%; Miller: score 33.839 to 34.684%; weekly-limit use 3.3190 to 1.1428%. Raw Sol XHigh versus Luna-based Bello Budget C+A. Three runs per task and arm. Mean score 48.100 to 48.797%. Total limit use 15.6297 to 5.2690%. Mean solution time 28:27 to 1:49:44.</desc>
<style>
svg { --bg:#fff; --ink:#1e2934; --muted:#596672; --grid:#e2e7ec;
