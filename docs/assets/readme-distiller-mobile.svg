<svg xmlns="http://www.w3.org/2000/svg" width="480" height="489" viewBox="0 0 480 489" role="img" aria-labelledby="readme-distiller-mobile-title readme-distiller-mobile-desc">
<title id="readme-distiller-mobile-title">Log distiller: cost versus quality</title>
<desc id="readme-distiller-mobile-desc">Astra XHigh: Raw cost index 100, score 62.22%; distiller cost index 77.98, score 60.57%; Luna Max: Raw cost index 100, score 56.75%; distiller cost index 85.22, score 55.45%. JSON Schema. Astra has 3 runs per arm and runtime off. Luna has 6 runs per arm; its distiller arm includes runtime. Cost is estimated at API-equivalent token rates, normalized separately to Raw = 100 for each model, not a comparison of absolute prices. Score axis 50–65%; cost axis 70–105. Lower cost and higher score are better.</desc>
<style>
svg { --bg:#fff; --ink:#26323e; --muted:#64707c; --grid:#e4e9ee;
  --raw:#557ca6; --bello:#c84b32; }
@media (prefers-color-scheme:dark) {
  svg { --bg:#0d1117; --ink:#edf2f7; --muted:#a6b2bf; --grid:#2b3542;
    --raw:#8dadd2; --bello:#ef987e; }
}
.paper { fill:var(--bg); }
text { font-family:Arial,Helvetica,sans-serif; fill:var(--ink);
  font-variant-numeric:tabular-nums; }
.muted { fill:var(--muted); }
.raw { fill:var(--raw); }
.bello { fill:var(--bello); }
.halo { paint-order:stroke; stroke:var(--bg); stroke-width:5; stroke-linejoin:round; }
.grid { stroke:var(--grid); stroke-width:1; }
.raw-line { stroke:var(--raw); fill:none; stroke-width:2.5; stroke-dasharray:7 5; }
.bello-line { stroke:var(--bello); fill:none; stroke-width:3; }
.raw-point { fill:var(--bg); stroke:var(--raw); stroke-width:2; }
.bello-point { fill:var(--bello); }
.raw-bar { fill:var(--raw); fill-opacity:.22; stroke:var(--raw); stroke-width:1.3; }
.bello-bar { fill:var(--bello); }
</style>
<rect class="paper" width="480" height="489"/>
<style>.cost-link { stroke:var(--muted); stroke-opacity:.55; stroke-width:1.5; }</style>
