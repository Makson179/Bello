<svg xmlns="http://www.w3.org/2000/svg" width="480" height="401" viewBox="0 0 480 401" role="img" aria-labelledby="readme-distiller-mobile-title readme-distiller-mobile-desc">
<title id="readme-distiller-mobile-title">Log distiller: estimated usage reduction</title>
<desc id="readme-distiller-mobile-desc">JSON Schema. Astra XHigh, 3 runs per arm, runtime off: 22.02% lower estimated usage. Luna Max, 6 runs per arm, runtime included: 14.78% lower estimated usage. Subtracting recorded runtime cost gives 25.28%, an accounting estimate, not an additional run. Usage uses API-equivalent token rates. Score and time tradeoffs are in the README.</desc>
<style>
svg { --bg:#fff; --ink:#26323e; --muted:#64707c; --grid:#e4e9ee;
  --raw:#557ca6; --bello:#c84b32; }
@media (prefers-color-scheme:dark) {
  svg { --bg:#0d1117; --ink:#edf2f7; --muted:#a6b2bf; --grid:#2b3542;
    --raw:#8dadd2; --bello:#ef987e; }
}
.paper { fill:var(--bg); }
text { font-family:Arial,Helvetica,sans-serif; fill:var(--ink);
  font-variant-numeric:tabular-nums; }
.muted { fill:var(--muted); }
.raw { fill:var(--raw); }
.bello { fill:var(--bello); }
.halo { paint-order:stroke; stroke:var(--bg); stroke-width:5; stroke-linejoin:round; }
.grid { stroke:var(--grid); stroke-width:1; }
.raw-line { stroke:var(--raw); fill:none; stroke-width:2.5; stroke-dasharray:7 5; }
.bello-line { stroke:var(--bello); fill:none; stroke-width:3; }
.raw-point { fill:var(--bg); stroke:var(--raw); stroke-width:2; }
.bello-point { fill:var(--bello); }
.raw-bar { fill:var(--raw); fill-opacity:.22; stroke:var(--raw); stroke-width:1.3; }
.bello-bar { fill:var(--bello); }
</style>
