  <path d="M36 434H964" stroke="#e6edf0"/>
  <text x="40" y="461" class="muted" font-size="17">3 tasks × 4 models × 2 systems</text>
  <text x="958" y="461" class="muted" font-size="17" text-anchor="end">Higher is better</text>
</svg>
