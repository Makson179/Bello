<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title description">
  <title id="title">Mean ProgramBench score across four models: Bello and Raw</title>
  <desc id="description">Higher scores are better. Each point is the mean reported ProgramBench score over three tasks. Luna: Bello 46.32%, Raw 32.75%. Terra: Bello 41.24%, Raw 31.75%. Sol: Bello 55.44%, Raw 48.98%. Astra: Bello 65.68%, Raw 59.70%. There are 24 runs: three tasks, four models, and two systems. The vertical score scale runs from 20% to 70%. The horizontal axis is categorical; straight line segments connect model categories and do not represent cost or time.</desc>
  <defs>
    <linearGradient id="advantage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b9689" stop-opacity=".13"/>
      <stop offset="1" stop-color="#0b9689" stop-opacity=".025"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .ink { fill: #172c38; }
      .muted { fill: #637785; }
      .number { font-variant-numeric: tabular-nums; font-weight: 650; }
      .point-label { font-size: 24px; paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }
      .grid { stroke: #e6edf0; stroke-width: 1; }
    </style>
  </defs>
  <rect x=".5" y=".5" width="999" height="479" rx="20" fill="#fff" stroke="#dce6ea"/>
  <rect x="36" y="31" width="5" height="26" rx="2.5" fill="#078b80"/>
  <text x="54" y="53" class="ink" font-size="29" font-weight="700" letter-spacing="-.7">ProgramBench, across models</text>
  <text x="54" y="81" class="muted" font-size="18">Mean reported score (%) · 24 runs</text>
  <g font-size="18" font-weight="650">
    <line x1="728" y1="47" x2="764" y2="47" stroke="#078b80" stroke-width="4" stroke-linecap="round"/>
    <circle cx="746" cy="47" r="5.5" fill="#078b80" stroke="#fff" stroke-width="2"/>
    <text x="774" y="53" fill="#087e74">Bello</text>
    <line x1="861" y1="47" x2="897" y2="47" stroke="#6b8198" stroke-width="3" stroke-linecap="round"/>
    <circle cx="879" cy="47" r="5.5" fill="#fff" stroke="#6b8198" stroke-width="2.5"/>
    <text x="907" y="53" fill="#526b83">Raw</text>
  </g>
  <g class="grid">
    <path d="M99 125H936 M99 175H936 M99 225H936 M99 275H936 M99 325H936 M99 375H936"/>
  </g>
  <g class="muted number" text-anchor="end" font-size="16">
    <text x="83" y="131">70</text>
    <text x="83" y="181">60</text>
    <text x="83" y="231">50</text>
    <text x="83" y="281">40</text>
    <text x="83" y="331">30</text>
    <text x="83" y="381">20</text>
  </g>
  <path d="M150 243.3833L390 268.8L630 197.8L870 146.5833L870 176.5L630 230.1167L390 316.2667L150 311.2333Z" fill="url(#advantage)"/>
  <polyline points="150,311.2333 390,316.2667 630,230.1167 870,176.5" fill="none" stroke="#6b8198" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="150,243.3833 390,268.8 630,197.8 870,146.5833" fill="none" stroke="#078b80" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff" stroke="#6b8198" stroke-width="3">
    <circle cx="150" cy="311.2333" r="7"/>
    <circle cx="390" cy="316.2667" r="7"/>
    <circle cx="630" cy="230.1167" r="7"/>
    <circle cx="870" cy="176.5" r="7"/>
  </g>
  <g fill="#078b80" stroke="#fff" stroke-width="3">
    <circle cx="150" cy="243.3833" r="8"/>
    <circle cx="390" cy="268.8" r="8"/>
    <circle cx="630" cy="197.8" r="8"/>
    <circle cx="870" cy="146.5833" r="8"/>
  </g>
  <g class="number point-label" text-anchor="middle" fill="#087e74">
    <text x="150" y="221">46.32</text>
    <text x="390" y="247">41.24</text>
    <text x="630" y="176">55.44</text>
    <text x="870" y="125">65.68</text>
  </g>
  <g class="number point-label" text-anchor="middle" fill="#526b83">
    <text x="150" y="345">32.75</text>
    <text x="390" y="350">31.75</text>
    <text x="630" y="264">48.98</text>
    <text x="870" y="210">59.70</text>
  </g>
  <g class="ink" text-anchor="middle" font-size="25" font-weight="650" letter-spacing="-.4">
