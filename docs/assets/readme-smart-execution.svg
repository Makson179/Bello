<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="476" viewBox="0 0 1080 476" role="img" aria-labelledby="readme-smart-execution-title readme-smart-execution-desc">
<title id="readme-smart-execution-title">Smart Execution: cost, solution time, and quality</title>
<desc id="readme-smart-execution-desc">Sonnet 5: mean API-equivalent cost $5.452532 to $3.806292, solver time 42.441352 to 21.220542 minutes, score 43.983822% to 42.366026%; Astra: mean API-equivalent cost $9.371333 to $6.409161, solver time 31.334286 to 26.614289 minutes, score 58.881025% to 58.442872%. RAW versus Smart Execution, three runs per model and setup. All bar axes start at zero. Changes are relative to RAW; cost and time are lower in both cases, as are mean scores.</desc>
<style>
svg { --bg:#fff; --ink:#26323e; --muted:#64707c; --grid:#e4e9ee;
  --raw:#557ca6; --bello:#c84b32; }
@media (prefers-color-scheme:dark) {
  svg { --bg:#0d1117; --ink:#edf2f7; --muted:#a6b2bf; --grid:#2b3542;
    --raw:#8dadd2; --bello:#ef987e; }
}
.paper { fill:var(--bg); }
text { font-family:Arial,Helvetica,sans-serif; fill:var(--ink);
  font-variant-numeric:tabular-nums; }
.muted { fill:var(--muted); }
.raw { fill:var(--raw); }
.bello { fill:var(--bello); }
.halo { paint-order:stroke; stroke:var(--bg); stroke-width:5; stroke-linejoin:round; }
.grid { stroke:var(--grid); stroke-width:1; }
.raw-line { stroke:var(--raw); fill:none; stroke-width:2.5; stroke-dasharray:7 5; }
.bello-line { stroke:var(--bello); fill:none; stroke-width:3; }
.raw-point { fill:var(--bg); stroke:var(--raw); stroke-width:2; }
.bello-point { fill:var(--bello); }
.raw-bar { fill:var(--raw); fill-opacity:.22; stroke:var(--raw); stroke-width:1.3; }
.bello-bar { fill:var(--bello); }
</style>
