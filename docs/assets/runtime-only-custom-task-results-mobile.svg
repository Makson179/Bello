<title id="runtime-only-custom-task-results-mobile-title">Runtime-only: score improved on all three custom tasks</title>
<desc id="runtime-only-custom-task-results-mobile-desc">Marl: 32.91 to 37.91%, solution time 58:49 to 46:09; Slab: 81.08 to 85.69%, solution time 57:26 to 1:04:11; Pinch: 89.25 to 98.00%, solution time 40:09 to 43:34. Each task has its own scoring criteria; there is no pooled score.</desc>
<style>
svg { --bg:#fff; --ink:#1e2934; --muted:#596672; --grid:#e2e7ec;
