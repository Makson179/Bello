name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main, codex/0.6.0-multi-provider, mystery]
  pull_request:

jobs:
  linux:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: supervisor/pi_worker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and verify Linux sandbox
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error::Native sandbox checks must run as the unprivileged runner."
            exit 1
          fi
          sandbox_diagnostics() {
            /usr/bin/bwrap --version
            sysctl kernel.unprivileged_userns_clone user.max_user_namespaces \
              kernel.apparmor_restrict_unprivileged_userns || true
            sudo grep -E 'bwrap|unprivileged_userns' \
              /sys/kernel/security/apparmor/profiles || true
            sudo journalctl -k --boot --no-pager --since '-2 minutes' \
              | grep -E 'apparmor=.*(bwrap|unprivileged_userns)' | tail -30 || true
          }
          sandbox_probe() {
            /usr/bin/bwrap --die-with-parent --new-session \
              --unshare-user --unshare-pid --unshare-ipc --unshare-uts --unshare-net \
              --cap-drop ALL --clearenv --ro-bind / / --proc /proc --dev /dev \
              -- /usr/bin/true
          }
          sandbox_diagnostics
          if ! sandbox_probe; then
            sandbox_diagnostics
            # Noble ships this targeted profile in apparmor-profiles, but does
            # not load it by default. Keep AppArmor and network isolation on.
            if [ ! -f /etc/apparmor.d/bwrap-userns-restrict ]; then
              sudo install -m 0644 \
                /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
                /etc/apparmor.d/bwrap-userns-restrict
            fi
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
            sandbox_diagnostics
            if ! sandbox_probe; then
              sandbox_diagnostics
              echo "::error::Bubblewrap cannot establish the required native sandbox."
              exit 1
            fi
          fi
      - name: Install pinned Pi runtime
        working-directory: supervisor/pi_worker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Python package and optional SDK
        run: python -m pip install -e ".[test,claude]" wheel
      - name: Run Pi worker tests
        working-directory: supervisor/pi_worker
        run: npm test
      - name: Run Python tests except the separately gated Pi integration
        env:
          BELLO_REQUIRE_NATIVE_SANDBOX: "1"
        run: python -m pytest -q --ignore=tests/test_runtime_pi_integration.py
      - name: Run real offline Pi SDK and native sandbox integration
        env:
          BELLO_REQUIRE_NATIVE_SANDBOX: "1"
          BELLO_REQUIRE_PI_INTEGRATION: "1"
        run: python -m pytest -q tests/test_runtime_pi_integration.py

  native-platforms:
    name: ${{ matrix.name }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            python-version: "3.13"
          - name: Windows Server 2022
            os: windows-2022
            python-version: "3.11"
          - name: Windows Server 2025
            os: windows-2025
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: supervisor/pi_worker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned Windows helper toolchain
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install pinned Pi runtime
        working-directory: supervisor/pi_worker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Python package and optional SDK
        run: python -m pip install ".[test,claude]" wheel
      - name: Stage and prepare the Windows native helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $helper = Resolve-Path "native/windows-sandbox/target/x86_64-pc-windows-msvc/release/bello-windows-sandbox.exe"
          $sourceBin = Join-Path $PWD "supervisor/runtime/bin"
          New-Item -ItemType Directory -Force -Path $sourceBin | Out-Null
          Copy-Item $helper (Join-Path $sourceBin "bello-windows-sandbox.exe")
          Copy-Item "native/windows-sandbox/THIRD_PARTY_NOTICES.txt" (Join-Path $sourceBin "THIRD_PARTY_NOTICES.txt")
          ./native/windows-sandbox/ci/verify_host_setup.ps1 `
            -Helper $helper -Phase Prepare `
            -SnapshotPath (Join-Path $env:RUNNER_TEMP "bello-host-setup-baseline.json") `
            -Report (Join-Path $env:RUNNER_TEMP "bello-host-setup-prepare.json")
          $setup = Get-Content (Join-Path $env:RUNNER_TEMP "bello-host-setup-prepare.json") -Raw | ConvertFrom-Json
          $checkoutRoot = [IO.Path]::GetPathRoot((Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName)
          if ($checkoutRoot -notmatch '^[A-Za-z]:\\$') { throw "checkout is not on a literal local drive" }
          if ($checkoutRoot -ine $setup.systemRoot) {
            ./native/windows-sandbox/ci/verify_host_setup.ps1 `
              -Helper $helper -Phase Prepare -Drive $checkoutRoot.Substring(0, 2) `
              -SnapshotPath (Join-Path $env:RUNNER_TEMP "bello-checkout-drive-baseline.json") `
              -Report (Join-Path $env:RUNNER_TEMP "bello-checkout-drive-prepare.json")
          }
      - name: Prepare and verify the Windows null device
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $helper = Resolve-Path "native/windows-sandbox/target/x86_64-pc-windows-msvc/release/bello-windows-sandbox.exe"
          ./native/windows-sandbox/ci/verify_null_device.ps1 `
            -Helper $helper -Phase Prepare `
            -SnapshotPath (Join-Path $env:RUNNER_TEMP "bello-null-device-baseline.json") `
            -Report (Join-Path $env:RUNNER_TEMP "bello-null-device-prepare.json")
      - name: Run Pi worker tests
        working-directory: supervisor/pi_worker
        run: npm test
      - name: Run full applicable Python suite except the separately gated Pi integration
        env:
          BELLO_REQUIRE_PI_INTEGRATION: "1"
        run: python -m pytest -v -o faulthandler_timeout=120 --ignore=tests/test_runtime_pi_integration.py
      - name: Run real offline Pi SDK and native sandbox integration
        env:
          BELLO_REQUIRE_NATIVE_SANDBOX: "1"
          BELLO_REQUIRE_PI_INTEGRATION: "1"
        run: python -m pytest -q tests/test_runtime_pi_integration.py
      - name: Exercise installed CLI help
        run: bello --help
      - name: Report Windows runner image
        if: runner.os == 'Windows'
        shell: pwsh
        run: Write-Output "$env:ImageOS $env:ImageVersion"
      - name: Verify doctor has no legacy executor dependency
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_doctor.py::test_doctor_does_not_start_the_removed_codex_executor
      - name: Restore and verify the Windows null-device security
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $snapshot = Join-Path $env:RUNNER_TEMP "bello-null-device-baseline.json"
          if (Test-Path -LiteralPath $snapshot) {
            $helper = Resolve-Path "native/windows-sandbox/target/x86_64-pc-windows-msvc/release/bello-windows-sandbox.exe"
            ./native/windows-sandbox/ci/verify_null_device.ps1 `
              -Helper $helper -Phase Restore -SnapshotPath $snapshot `
              -Report (Join-Path $env:RUNNER_TEMP "bello-null-device-restore.json")
          }
      - name: Restore the Windows checkout-drive setup ACL
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $snapshot = Join-Path $env:RUNNER_TEMP "bello-checkout-drive-baseline.json"
          if (Test-Path -LiteralPath $snapshot) {
            $selection = Get-Content -LiteralPath $snapshot -Raw | ConvertFrom-Json
            $helper = Resolve-Path "native/windows-sandbox/target/x86_64-pc-windows-msvc/release/bello-windows-sandbox.exe"
            ./native/windows-sandbox/ci/verify_host_setup.ps1 `
              -Helper $helper -Phase Restore -Drive $selection.selectedDrive -SnapshotPath $snapshot `
              -Report (Join-Path $env:RUNNER_TEMP "bello-checkout-drive-restore.json")
          }
      - name: Restore the Windows host setup ACL
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $snapshot = Join-Path $env:RUNNER_TEMP "bello-host-setup-baseline.json"
          if (Test-Path -LiteralPath $snapshot) {
            $helper = Resolve-Path "native/windows-sandbox/target/x86_64-pc-windows-msvc/release/bello-windows-sandbox.exe"
            ./native/windows-sandbox/ci/verify_host_setup.ps1 `
              -Helper $helper -Phase Restore -SnapshotPath $snapshot `
              -Report (Join-Path $env:RUNNER_TEMP "bello-host-setup-restore.json")
          }
      - name: Upload Windows host setup verification
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-host-setup-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/bello-host-setup-prepare.json
            ${{ runner.temp }}/bello-host-setup-restore.json
            ${{ runner.temp }}/bello-checkout-drive-prepare.json
            ${{ runner.temp }}/bello-checkout-drive-restore.json
            ${{ runner.temp }}/bello-null-device-prepare.json
            ${{ runner.temp }}/bello-null-device-restore.json
          if-no-files-found: ignore
