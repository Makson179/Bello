name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main, codex/0.6.0-multi-provider, mystery]
  pull_request:

jobs:
  linux:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: supervisor/pi_worker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and verify Linux sandbox
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error::Native sandbox checks must run as the unprivileged runner."
            exit 1
          fi
          sandbox_diagnostics() {
            /usr/bin/bwrap --version
            sysctl kernel.unprivileged_userns_clone user.max_user_namespaces \
              kernel.apparmor_restrict_unprivileged_userns || true
            sudo grep -E 'bwrap|unprivileged_userns' \
              /sys/kernel/security/apparmor/profiles || true
            sudo journalctl --kernel --boot --no-pager --since '-2 minutes' \
              | grep -E 'apparmor=.*(bwrap|unprivileged_userns)' | tail -30 || true
          }
          sandbox_probe() {
            /usr/bin/bwrap --die-with-parent --new-session \
              --unshare-user --unshare-pid --unshare-ipc --unshare-uts --unshare-net \
              --cap-drop ALL --clearenv --ro-bind / / --proc /proc --dev /dev \
              -- /usr/bin/true
          }
          sandbox_diagnostics
          if ! sandbox_probe; then
            sandbox_diagnostics
            # Noble ships this targeted profile in apparmor-profiles, but does
            # not load it by default. Keep AppArmor and network isolation on.
            if [ ! -f /etc/apparmor.d/bwrap-userns-restrict ]; then
              sudo install -m 0644 \
                /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
                /etc/apparmor.d/bwrap-userns-restrict
            fi
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
            sandbox_diagnostics
            if ! sandbox_probe; then
              sandbox_diagnostics
              echo "::error::Bubblewrap cannot establish the required native sandbox."
              exit 1
            fi
          fi
      - name: Install pinned Pi runtime
        working-directory: supervisor/pi_worker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Python package and optional SDK
        run: python -m pip install -e ".[test,claude]" wheel
      - name: Run Pi worker tests
        working-directory: supervisor/pi_worker
        run: npm test
      - name: Run Python tests except the separately gated Pi integration
        env:
          BELLO_REQUIRE_NATIVE_SANDBOX: "1"
        run: python -m pytest -q --ignore=tests/test_runtime_pi_integration.py
      - name: Run real offline Pi SDK and native sandbox integration
        env:
          BELLO_REQUIRE_NATIVE_SANDBOX: "1"
          BELLO_REQUIRE_PI_INTEGRATION: "1"
        run: python -m pytest -q tests/test_runtime_pi_integration.py

  native-platforms:
    name: ${{ matrix.name }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            python-version: "3.13"
          - name: Windows Server 2022
            os: windows-2022
            python-version: "3.11"
          - name: Windows Server 2025
            os: windows-2025
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: supervisor/pi_worker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned Windows helper toolchain
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install pinned Pi runtime
        working-directory: supervisor/pi_worker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Python package and optional SDK
        run: python -m pip install ".[test,claude]" wheel
      - name: Run Pi worker tests
        working-directory: supervisor/pi_worker
        run: npm test
      - name: Run full applicable Python suite except the separately gated Pi integration
        run: python -m pytest -q --ignore=tests/test_runtime_pi_integration.py
      - name: Run real offline Pi SDK and native sandbox integration
        if: runner.os != 'Windows'
        env:
          BELLO_REQUIRE_NATIVE_SANDBOX: "1"
          BELLO_REQUIRE_PI_INTEGRATION: "1"
        run: python -m pytest -q tests/test_runtime_pi_integration.py
      - name: Exercise installed CLI help
        run: bello --help
      - name: Report Windows runner image
        if: runner.os == 'Windows'
        shell: pwsh
        run: Write-Output "$env:ImageOS $env:ImageVersion"
      - name: Verify doctor has no legacy executor dependency
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_doctor.py::test_doctor_does_not_start_the_removed_codex_executor
