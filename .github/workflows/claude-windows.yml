name: Claude Code on native Windows

# Proves the explicit SDK 0.2.164 / official CLI 2.1.293 pairing on Windows.
# The SDK declares bundled CLI 2.1.292; Bello must prefer its pinned 2.1.293
# download even when that older SDK bundle exists (size/SHA-256/private cache).
# BELLO_RUNTIME_DIR stays unset: the proof uses the real default per-user cache,
# %USERPROFILE%\.bello\runtime, not a shared runner directory.
# No login, prompt or model request is made; no credentials are configured.

on:
  workflow_dispatch:
  push:
    branches: [main, codex/windows-claude-config-071, codex/072-recovery-validation]
  pull_request:

permissions:
  contents: read

jobs:
  claude-windows:
    name: ${{ matrix.name }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Server 2022
            os: windows-2022
            python-version: "3.11"
          - name: Windows Server 2025
            os: windows-2025
            python-version: "3.14"
    env:
      BELLO_SKIP_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned Windows helper toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Bello with the pinned Claude extra
        run: python -m pip install ".[test,claude]"
      - name: Verify the pinned SDK and its declared bundled-CLI version
        run: python scripts/verify_claude_cli_windows.py sdk
      - name: Offline Windows Claude and configuration regressions
        run: >-
          python -m pytest -v -o faulthandler_timeout=120
          tests/test_claude_cli_windows.py tests/test_claude_dependency_platforms.py
          tests/test_config_validation_ux.py tests/test_claude_sonnet55_config.py
          tests/test_claude_haiku55_runtime.py tests/test_claude_haiku55_config.py
          tests/test_runtime_claude.py tests/test_doctor_runtime_dependencies.py
          tests/test_runtime_login_routing.py tests/test_update_runtime.py
          tests/test_update_fresh_process.py tests/test_native_codex_install.py
      - name: Unprepared readiness fails closed without downloading
        run: python scripts/verify_claude_cli_windows.py before
      - name: Record whether RUNNER_TEMP could contain the private cache (informational, read-only)
        run: python scripts/verify_claude_cli_windows.py runner-temp
        continue-on-error: true
      - name: Prepare the official CLI through Bello (one verified download)
        run: bello runtime install claude-code
      - name: Reuse the verified cache without another download
        run: bello runtime install claude-code
      - name: Verify cache, checksum, ACLs, Authenticode signer and version
        run: python scripts/verify_claude_cli_windows.py after
      - name: Signed-out metadata lists Sonnet 5.5 and Haiku 5.5 (no login, no prompt)
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}\claude-config-signed-out
        run: python scripts/verify_claude_cli_windows.py metadata
      - name: Doctor output (informational)
        if: always()
        run: bello doctor
        continue-on-error: true
