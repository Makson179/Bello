name: Native Codex 0.161 candidate qualification

on:
  push:
    branches: ['codex/080-production-ready']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-codex-candidate-0161-${{ github.ref }}
  cancel-in-progress: false

# CI-only candidate: no release upload, installer pin, or provider credentials.
# Ready binaries and Cargo state use exact, candidate-only input identities.
# Each proof job qualifies, packages and cold-installs only the candidate its
# own build job verified against THIS commit's recipe (fresh or exact-cache hit).
# Artifacts use this run/attempt's exact name, never another run or artifact ID;
# nothing is published or pinned. Editing this file changes the build identity.
jobs:
  linux-build:
    if: github.ref == 'refs/heads/codex/080-production-ready'
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    outputs:
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the exact pushed commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Identify exact 0.161 candidate build inputs
        id: identity
        run: |
          key=$(python scripts/build_native_codex_candidate.py build-key --target linux-x64)
          [[ "$key" =~ ^[0-9a-f]{64}$ ]]
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "artifact-name=native-codex-candidate-0161-linux-x64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: candidate
        with:
          path: native-candidate
          key: native-codex-candidate-0161-linux-x64-ready-v1-${{ steps.identity.outputs.key }}
      - name: Validate exact cached receipt and every binary before reuse
        if: steps.candidate.outputs.cache-hit == 'true'
        run: python scripts/build_native_codex_candidate.py verify-build --target linux-x64 --candidate native-candidate
      - name: Configure isolated native build paths
        if: steps.candidate.outputs.cache-hit != 'true'
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/bello-candidate-0161-target" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/bello-candidate-0161-cargo" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: steps.candidate.outputs.cache-hit != 'true'
        with:
          repository: openai/codex
          ref: 979011409de0a60b52f179721948e65531d26144
          path: native-source
          persist-credentials: false
      - name: Install Linux native build dependencies
        if: steps.candidate.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends binutils pkg-config libcap-dev libssl-dev clang cmake
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        if: steps.candidate.outputs.cache-hit != 'true'
        with:
          toolchain: '1.95.0'
          targets: x86_64-unknown-linux-gnu
      - uses: actions/cache/restore@v4
        if: steps.candidate.outputs.cache-hit != 'true'
        id: cargo_cache
        with:
          path: |
            ${{ runner.temp }}/bello-candidate-0161-cargo/registry
            ${{ runner.temp }}/bello-candidate-0161-cargo/git
            ${{ runner.temp }}/bello-candidate-0161-target
          key: native-codex-candidate-0161-linux-x64-cargo-v1-${{ steps.identity.outputs.key }}
          # Cargo revalidates changed source; ready binaries never use fallback.
          restore-keys: native-codex-candidate-0161-linux-x64-cargo-v1-
      - name: Apply only the pinned 0.161 candidate patch
        if: steps.candidate.outputs.cache-hit != 'true'
        run: python scripts/prepare_native_codex_candidate.py prepare --source native-source
      - name: Download and verify pinned V8 v150.4 artifacts
        if: steps.candidate.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bello-candidate-0161-v8"
          base=https://github.com/openai/codex/releases/download/rusty-v8-v150.4.0
          archive=librusty_v8_ptrcomp_sandbox_release_x86_64-unknown-linux-gnu.a.gz
          binding=src_binding_ptrcomp_sandbox_release_x86_64-unknown-linux-gnu.rs
          for name in "$archive" "$binding"; do
            curl --fail --location --retry 3 "$base/$name" -o "$RUNNER_TEMP/bello-candidate-0161-v8/$name"
          done
          python scripts/prepare_native_codex_linux.py verify-v8 --directory "$RUNNER_TEMP/bello-candidate-0161-v8"
          echo "RUSTY_V8_ARCHIVE=$RUNNER_TEMP/bello-candidate-0161-v8/$archive" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=$RUNNER_TEMP/bello-candidate-0161-v8/$binding" >> "$GITHUB_ENV"
      - name: Finalize bwrap before compiling its digest into Codex
        if: steps.candidate.outputs.cache-hit != 'true'
        working-directory: native-source/codex-rs
        run: |
          cargo build --locked --release --timings --target x86_64-unknown-linux-gnu --bin bwrap
          bwrap="$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap"
          digest=$(sha256sum "$bwrap" | cut -d ' ' -f 1)
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          echo "CODEX_BWRAP_SHA256=$digest" >> "$GITHUB_ENV"
      - name: Compile native Codex and code-mode host
        if: steps.candidate.outputs.cache-hit != 'true'
        working-directory: native-source/codex-rs
        run: cargo build --locked --release --timings --target x86_64-unknown-linux-gnu --bin codex --bin codex-code-mode-host
      - name: Test native path URI conversions before snapshotting the candidate
        if: steps.candidate.outputs.cache-hit != 'true'
        working-directory: native-source/codex-rs
        run: cargo test --locked --release --target x86_64-unknown-linux-gnu -p codex-utils-path-uri --lib
      - name: Test lossless permission path serialization before snapshotting the candidate
        if: steps.candidate.outputs.cache-hit != 'true'
        working-directory: native-source/codex-rs
        run: cargo test --locked --release --target x86_64-unknown-linux-gnu -p codex-protocol --lib bello_permission_path_roundtrip
      - name: Test native NNC Smart Execution and selection regressions before snapshot
        if: steps.candidate.outputs.cache-hit != 'true'
        working-directory: native-source/codex-rs
        run: cargo test --locked --release --target x86_64-unknown-linux-gnu -p codex-core --lib -j 3 -- bello native_async native_selection native_steer_generation
      - name: Preserve the exact successful Cargo build
        if: steps.candidate.outputs.cache-hit != 'true' && steps.cargo_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/bello-candidate-0161-cargo/registry
            ${{ runner.temp }}/bello-candidate-0161-cargo/git
            ${{ runner.temp }}/bello-candidate-0161-target
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}
      - name: Snapshot all binaries and immutable build receipt independently of proof
        if: steps.candidate.outputs.cache-hit != 'true'
        run: python scripts/build_native_codex_candidate.py snapshot-build --target linux-x64 --source native-source --release "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release" --cargo-home "$CARGO_HOME" --output native-candidate
      - name: Verify every candidate file and exact build identity
        run: python scripts/build_native_codex_candidate.py verify-build --target linux-x64 --candidate native-candidate
      - name: Preserve exact verified candidate cache
        if: steps.candidate.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: native-candidate
          key: ${{ steps.candidate.outputs.cache-primary-key }}
      - name: Preserve CI-only binaries before proof jobs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: native-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows-build:
    if: github.ref == 'refs/heads/codex/080-production-ready'
    runs-on: windows-2025
    timeout-minutes: 240
    outputs:
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the exact pushed commit
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'Checkout is not the exact pushed commit' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Identify exact 0.161 candidate build inputs
        id: identity
        run: |
          $key = python scripts/build_native_codex_candidate.py build-key --target windows-x64
          if ($LASTEXITCODE -ne 0 -or $key -notmatch '^[0-9a-f]{64}$') { throw 'Invalid candidate build identity' }
          "key=$key" >> $env:GITHUB_OUTPUT
          "artifact-name=native-codex-candidate-0161-windows-x64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v4
        id: candidate
        with:
          path: native-candidate
          key: native-codex-candidate-0161-windows-x64-ready-v1-${{ steps.identity.outputs.key }}
      - name: Validate exact cached receipt and every binary before reuse
        if: steps.candidate.outputs.cache-hit == 'true'
        run: python scripts/build_native_codex_candidate.py verify-build --target windows-x64 --candidate native-candidate
      - name: Configure isolated native build paths
        if: steps.candidate.outputs.cache-hit != 'true'
        run: |
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'bello-candidate-0161-target')" >> $env:GITHUB_ENV
          "CARGO_HOME=$(Join-Path $env:RUNNER_TEMP 'bello-candidate-0161-cargo')" >> $env:GITHUB_ENV
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        if: steps.candidate.outputs.cache-hit != 'true'
        with:
          repository: openai/codex
          ref: 979011409de0a60b52f179721948e65531d26144
          path: native-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        if: steps.candidate.outputs.cache-hit != 'true'
        with:
          toolchain: '1.95.0'
          targets: x86_64-pc-windows-msvc
      - uses: ./native-source/.github/actions/setup-msvc-env
        if: steps.candidate.outputs.cache-hit != 'true'
        with:
          target: x86_64-pc-windows-msvc
      - uses: actions/cache/restore@v4
        if: steps.candidate.outputs.cache-hit != 'true'
        id: cargo_cache
        with:
          path: |
            ${{ runner.temp }}/bello-candidate-0161-cargo/registry
            ${{ runner.temp }}/bello-candidate-0161-cargo/git
            ${{ runner.temp }}/bello-candidate-0161-target
          key: native-codex-candidate-0161-windows-x64-cargo-v1-${{ steps.identity.outputs.key }}
          # Cargo revalidates changed source; ready binaries never use fallback.
          restore-keys: native-codex-candidate-0161-windows-x64-cargo-v1-
      - name: Apply only the pinned 0.161 candidate patch
        if: steps.candidate.outputs.cache-hit != 'true'
        run: python scripts/prepare_native_codex_candidate.py prepare --source native-source
      - name: Download and verify pinned V8 v150.4 artifacts
        if: steps.candidate.outputs.cache-hit != 'true'
        run: |
          $v8 = Join-Path $env:RUNNER_TEMP 'bello-candidate-0161-v8'
          New-Item -ItemType Directory -Path $v8 -Force | Out-Null
          $base = 'https://github.com/openai/codex/releases/download/rusty-v8-v150.4.0'
          $archive = 'rusty_v8_ptrcomp_sandbox_release_x86_64-pc-windows-msvc.lib.gz'
          $binding = 'src_binding_ptrcomp_sandbox_release_x86_64-pc-windows-msvc.rs'
          foreach ($name in @($archive, $binding)) {
            Invoke-WebRequest "$base/$name" -OutFile (Join-Path $v8 $name)
          }
          python scripts/prepare_native_codex_windows.py verify-v8 --directory $v8
          if ($LASTEXITCODE -ne 0) { throw 'Pinned V8 verification failed' }
          "RUSTY_V8_ARCHIVE=$(Join-Path $v8 $archive)" >> $env:GITHUB_ENV
          "RUSTY_V8_SRC_BINDING_PATH=$(Join-Path $v8 $binding)" >> $env:GITHUB_ENV
      - name: Compile all four native Windows executables
        if: steps.candidate.outputs.cache-hit != 'true'
        working-directory: native-source/codex-rs
        run: cargo build --locked --release --timings --target x86_64-pc-windows-msvc --bin codex --bin codex-code-mode-host --bin codex-command-runner --bin codex-windows-sandbox-setup
      - name: Test native Windows drive-root URI roundtrips before snapshotting the candidate
        if: steps.candidate.outputs.cache-hit != 'true'
        working-directory: native-source/codex-rs
        run: cargo test --locked --release --target x86_64-pc-windows-msvc -p codex-utils-path-uri --lib
      - name: Test lossless Windows permission path serialization before snapshotting the candidate
        if: steps.candidate.outputs.cache-hit != 'true'
        working-directory: native-source/codex-rs
        run: cargo test --locked --release --target x86_64-pc-windows-msvc -p codex-protocol --lib bello_permission_path_roundtrip
      - name: Test native NNC Smart Execution and selection regressions before snapshot
        if: steps.candidate.outputs.cache-hit != 'true'
        working-directory: native-source/codex-rs
        run: cargo test --locked --release --target x86_64-pc-windows-msvc -p codex-core --lib -j 3 -- bello native_async native_selection native_steer_generation
      - name: Preserve the exact successful Cargo build
        if: steps.candidate.outputs.cache-hit != 'true' && steps.cargo_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/bello-candidate-0161-cargo/registry
            ${{ runner.temp }}/bello-candidate-0161-cargo/git
            ${{ runner.temp }}/bello-candidate-0161-target
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}
      - name: Snapshot all binaries and immutable build receipt independently of proof
        if: steps.candidate.outputs.cache-hit != 'true'
        run: python scripts/build_native_codex_candidate.py snapshot-build --target windows-x64 --source native-source --release "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release" --cargo-home "$env:CARGO_HOME" --output native-candidate
      - name: Verify every candidate file and exact build identity
        run: python scripts/build_native_codex_candidate.py verify-build --target windows-x64 --candidate native-candidate
      - name: Preserve exact verified candidate cache
        if: steps.candidate.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: native-candidate
          key: ${{ steps.candidate.outputs.cache-primary-key }}
      - name: Preserve CI-only binaries before proof jobs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: native-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux-proof:
    if: github.ref == 'refs/heads/codex/080-production-ready'
    needs: linux-build
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the exact pushed commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.linux-build.outputs.artifact-name }}
          path: native-candidate
      - name: Verify all receipt hashes before restoring executable modes
        run: python scripts/build_native_codex_candidate.py verify-build --target linux-x64 --candidate native-candidate --restore-executable-modes
      - name: Install CPU inference and local proof dependencies
        run: |
          python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[log-distiller,test]"
      - name: Validate build, qualifier, packaging and branch routing contracts
        run: python -m pytest -q tests/test_native_codex_candidate.py tests/test_build_native_codex_candidate.py tests/test_verify_native_codex_candidate.py tests/test_verify_native_codex_context.py tests/test_native_context_release_binding.py tests/test_release_native_codex_candidate.py tests/test_native_codex_candidate_workflow.py tests/test_native_codex_release_workflow.py tests/test_github_branch_workflow.py --junitxml=native-candidate-tests.xml
      - name: Qualify selection9 async15 history1 context8, Linux sandbox and six real CPU ModernBERT cases
        run: python scripts/verify_native_codex_candidate.py --candidate native-candidate --target linux-x64 --output-dir candidate-proof --modernbert
      - name: Package only this job's qualified exact candidate
        run: python scripts/release_native_codex_candidate.py package --target linux-x64 --candidate native-candidate --qualification candidate-proof --output "$RUNNER_TEMP/native-release"
      - name: Cold-install that archive through the production private cache and repeat every proof
        run: python scripts/release_native_codex_candidate.py install-local --target linux-x64 --artifact "$RUNNER_TEMP/native-release" --runtime-root "$RUNNER_TEMP/bello-0161-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/release-receipts/installed" --modernbert
      - name: Bind commit, binary, qualification, archive and installed proof together
        shell: python
        env:
          BELLO_TARGET: linux-x64
          BELLO_CANDIDATE_ARTIFACT: ${{ needs.linux-build.outputs.artifact-name }}
          BELLO_RELEASE_DIR: ${{ runner.temp }}/native-release
          BELLO_INSTALLED_DIR: ${{ runner.temp }}/release-receipts/installed
          BELLO_BINDING_FILE: ${{ runner.temp }}/release-receipts/source-binding.json
        run: |
          import hashlib
          import json
          import os
          import platform
          import re
          from pathlib import Path


          def reject(reason):
              raise SystemExit("Exact source binding rejected: " + reason)


          def require(condition, reason):
              if not condition:
                  reject(reason)


          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()


          def load(path):
              value = json.loads(Path(path).read_text(encoding="utf-8"))
              require(isinstance(value, dict), "evidence must be a JSON object")
              return value


          def is_digest(value):
              return isinstance(value, str) and re.fullmatch(r"[0-9a-f]{64}", value) is not None


          def proof_cases(report):
              proofs = report.get("proofs")
              require(isinstance(proofs, dict) and proofs, "the proof inventory is missing")
              counts = {}
              for name, item in proofs.items():
                  require(isinstance(item, dict) and item.get("passed") is True
                          and type(item.get("cases")) is int and item["cases"] > 0
                          and is_digest(item.get("sha256")), "a proof did not pass with counted cases")
                  counts[name] = item["cases"]
              return counts


          target = os.environ["BELLO_TARGET"]
          executable = "bin/codex.exe" if target == "windows-x64" else "bin/codex"
          source = os.environ["GITHUB_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          require(re.fullmatch(r"[0-9a-f]{40}", source) is not None, "the pushed commit is not a full SHA")
          require(re.fullmatch(r"[0-9]+", run_id) is not None, "the workflow run is not numeric")
          artifact = os.environ["BELLO_CANDIDATE_ARTIFACT"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          require(re.fullmatch(r"[1-9][0-9]*", attempt) is not None, "the workflow attempt is not numeric")
          require(artifact == f"native-codex-candidate-0161-{target}-{source}-{run_id}-{attempt}",
                  "the candidate artifact was not produced for this commit and run")

          candidate, proof = Path("native-candidate"), Path("candidate-proof")
          release, installed = Path(os.environ["BELLO_RELEASE_DIR"]), Path(os.environ["BELLO_INSTALLED_DIR"])
          binding = Path(os.environ["BELLO_BINDING_FILE"])

          receipt_path = candidate / "native-build-receipt.json"
          receipt = load(receipt_path)
          files, identity = receipt.get("files"), receipt.get("identity")
          require(isinstance(files, dict) and isinstance(identity, dict) and is_digest(identity.get("build_key")),
                  "the candidate receipt lacks its file inventory or build identity")
          binary = files.get(executable)
          require(is_digest(binary) and digest(candidate / executable) == binary,
                  "the candidate executable differs from its build receipt")
          receipt_sha256 = digest(receipt_path)

          aggregate_path, worker_path = proof / "qualification.json", proof / "worker" / "qualification.json"
          aggregate, worker = load(aggregate_path), load(worker_path)
          for report in (aggregate, worker):
              require(report.get("passed") is True and report.get("published") is False
                      and report.get("target") == target and report.get("binary_sha256") == binary
                      and report.get("build_receipt_sha256") == receipt_sha256
                      and report.get("build_identity") == identity and report.get("candidate_files") == files,
                      "the qualification is not bound to this candidate")
          require(aggregate.get("worker_report_sha256") == digest(worker_path),
                  "the aggregate qualification names a different worker report")

          checks = load(release / "checksums.json")
          archive_name = checks.get("archive")
          require(isinstance(archive_name, str) and Path(archive_name).name == archive_name,
                  "the package names no single archive file")
          archive_sha256 = digest(release / archive_name)
          manifest_sha256 = checks.get("manifest_sha256")
          require(checks.get("published") is False and checks.get("target") == target
                  and checks.get("archive_sha256") == archive_sha256 and is_digest(manifest_sha256)
                  and checks.get("build_receipt_sha256") == receipt_sha256
                  and checks.get("qualification_sha256") == digest(aggregate_path)
                  and checks.get("build_identity") == identity
                  and isinstance(checks.get("files"), dict) and checks["files"].get(executable) == binary,
                  "the package is not bound to this candidate and qualification")

          installed_path, installed_worker_path = installed / "installed-proof.json", installed / "worker" / "report.json"
          final, final_worker = load(installed_path), load(installed_worker_path)
          for report in (final, final_worker):
              require(report.get("passed") is True and report.get("published") is False
                      and report.get("target") == target and report.get("archive_sha256") == archive_sha256
                      and report.get("manifest_sha256") == manifest_sha256,
                      "the installed proof did not use this archive")
          cache = final_worker.get("cache_files")
          require(final.get("worker_report_sha256") == digest(installed_worker_path)
                  and final_worker.get("binary_sha256") == binary
                  and final_worker.get("distribution_source") == "local-archive"
                  and isinstance(cache, dict) and isinstance(cache.get(executable), dict)
                  and cache[executable].get("sha256") == binary,
                  "the installed executable is not the candidate executable")

          qualified, repeated = proof_cases(aggregate), proof_cases(final)
          require(qualified == repeated, "the installed proofs differ from the qualification")
          required = {"selection": 9, "async": 15, "history": 1, "context": 8, "modernbert": 6}
          if target == "linux-x64":
              required["sandbox"] = 1
          require(qualified == required,
                  "the full proof set including the eight context cases is required")

          record = {
              "schema": "bello.native-ci-source-binding.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "source_sha": source,
              "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF", ""),
              "run_id": int(run_id),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "job": os.environ["GITHUB_JOB"],
              "runner_os": os.environ["RUNNER_OS"],
              "runner_image": os.environ.get("ImageVersion", ""),
              "python": platform.python_version(),
              "target": target,
              "candidate_artifact": artifact,
              "build_key": identity["build_key"],
              "build_receipt_sha256": receipt_sha256,
              "binary_sha256": binary,
              "qualification_sha256": digest(aggregate_path),
              "worker_qualification_sha256": digest(worker_path),
              "archive": archive_name,
              "archive_sha256": archive_sha256,
              "manifest_sha256": manifest_sha256,
              "installed_proof_sha256": digest(installed_path),
              "installed_worker_report_sha256": digest(installed_worker_path),
              "proof_cases": qualified,
              "published": False,
          }
          binding.parent.mkdir(parents=True, exist_ok=True)
          with binding.open("x", encoding="utf-8", newline="\n") as stream:
              stream.write(json.dumps(record, indent=2, sort_keys=True) + "\n")
          print(json.dumps({"bound": True, "source_sha": source, "target": target,
                            "binary_sha256": binary, "archive_sha256": archive_sha256}))
      - name: Preserve qualified archive and its checksums without publishing
        uses: actions/upload-artifact@v4
        with:
          name: native-codex-release-0161-linux-x64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-release/*.tar.gz
            ${{ runner.temp }}/native-release/checksums.json
            ${{ runner.temp }}/native-release/bundle/selection-manifest.json
            ${{ runner.temp }}/native-release/bundle/BUILD-INFO
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve bounded synthetic receipts even when proof fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-codex-candidate-0161-linux-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-candidate/native-build-receipt.json
            native-candidate/BUILD-INFO
            native-candidate-tests.xml
            candidate-proof/qualification.json
            candidate-proof/worker/qualification.json
            candidate-proof/worker/*/report.json
            candidate-proof/worker/*/*/result.json
            candidate-proof/worker/context/*/receipt.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve bounded installed-proof receipts and the source binding even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-codex-installed-proof-0161-linux-x64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-receipts/source-binding.json
            ${{ runner.temp }}/release-receipts/installed/installed-proof.json
            ${{ runner.temp }}/release-receipts/installed/worker/report.json
            ${{ runner.temp }}/release-receipts/installed/worker/*/report.json
            ${{ runner.temp }}/release-receipts/installed/worker/*/*/result.json
            ${{ runner.temp }}/release-receipts/installed/worker/context/*/receipt.json
          if-no-files-found: warn
          retention-days: 14

  windows-proof:
    if: github.ref == 'refs/heads/codex/080-production-ready'
    needs: windows-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            python: '3.11'
          - os: windows-2025
            python: '3.14'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the exact pushed commit
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'Checkout is not the exact pushed commit' }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-build.outputs.artifact-name }}
          path: native-candidate
      - name: Verify all receipt hashes before executing any candidate
        run: python scripts/build_native_codex_candidate.py verify-build --target windows-x64 --candidate native-candidate
      - name: Install CPU inference and local proof dependencies
        run: |
          python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e ".[log-distiller,test]"
          exit $LASTEXITCODE
      - name: Validate build, qualifier, packaging and branch routing contracts
        run: python -m pytest -q tests/test_native_codex_candidate.py tests/test_build_native_codex_candidate.py tests/test_verify_native_codex_candidate.py tests/test_verify_native_codex_context.py tests/test_native_context_release_binding.py tests/test_release_native_codex_candidate.py tests/test_native_codex_candidate_workflow.py tests/test_native_codex_release_workflow.py tests/test_github_branch_workflow.py --junitxml=native-candidate-tests.xml
      - name: Qualify selection9 async15 history1 context8 and six real CPU ModernBERT cases
        run: python scripts/verify_native_codex_candidate.py --candidate native-candidate --target windows-x64 --output-dir candidate-proof --modernbert
      - name: Package only this job's qualified exact candidate
        run: |
          python scripts/release_native_codex_candidate.py package --target windows-x64 --candidate native-candidate --qualification candidate-proof --output "$env:RUNNER_TEMP/native-release"
          exit $LASTEXITCODE
      - name: Cold-install that archive on this OS through the production private cache and repeat every proof
        run: |
          # The private per-user anchor, not the shared runner temp, holds the native cache.
          $runtimeRoot = Join-Path $env:LOCALAPPDATA "bello-0161-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python scripts/release_native_codex_candidate.py install-local --target windows-x64 --artifact "$env:RUNNER_TEMP/native-release" --runtime-root "$runtimeRoot" --output "$env:RUNNER_TEMP/release-receipts/installed" --modernbert
          exit $LASTEXITCODE
      - name: Bind commit, binary, qualification, archive and installed proof together
        shell: python
        env:
          BELLO_TARGET: windows-x64
          BELLO_CANDIDATE_ARTIFACT: ${{ needs.windows-build.outputs.artifact-name }}
          BELLO_RELEASE_DIR: ${{ runner.temp }}/native-release
          BELLO_INSTALLED_DIR: ${{ runner.temp }}/release-receipts/installed
          BELLO_BINDING_FILE: ${{ runner.temp }}/release-receipts/source-binding.json
        run: |
          import hashlib
          import json
          import os
          import platform
          import re
          from pathlib import Path


          def reject(reason):
              raise SystemExit("Exact source binding rejected: " + reason)


          def require(condition, reason):
              if not condition:
                  reject(reason)


          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()


          def load(path):
              value = json.loads(Path(path).read_text(encoding="utf-8"))
              require(isinstance(value, dict), "evidence must be a JSON object")
              return value


          def is_digest(value):
              return isinstance(value, str) and re.fullmatch(r"[0-9a-f]{64}", value) is not None


          def proof_cases(report):
              proofs = report.get("proofs")
              require(isinstance(proofs, dict) and proofs, "the proof inventory is missing")
              counts = {}
              for name, item in proofs.items():
                  require(isinstance(item, dict) and item.get("passed") is True
                          and type(item.get("cases")) is int and item["cases"] > 0
                          and is_digest(item.get("sha256")), "a proof did not pass with counted cases")
                  counts[name] = item["cases"]
              return counts


          target = os.environ["BELLO_TARGET"]
          executable = "bin/codex.exe" if target == "windows-x64" else "bin/codex"
          source = os.environ["GITHUB_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          require(re.fullmatch(r"[0-9a-f]{40}", source) is not None, "the pushed commit is not a full SHA")
          require(re.fullmatch(r"[0-9]+", run_id) is not None, "the workflow run is not numeric")
          artifact = os.environ["BELLO_CANDIDATE_ARTIFACT"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          require(re.fullmatch(r"[1-9][0-9]*", attempt) is not None, "the workflow attempt is not numeric")
          require(artifact == f"native-codex-candidate-0161-{target}-{source}-{run_id}-{attempt}",
                  "the candidate artifact was not produced for this commit and run")

          candidate, proof = Path("native-candidate"), Path("candidate-proof")
          release, installed = Path(os.environ["BELLO_RELEASE_DIR"]), Path(os.environ["BELLO_INSTALLED_DIR"])
          binding = Path(os.environ["BELLO_BINDING_FILE"])

          receipt_path = candidate / "native-build-receipt.json"
          receipt = load(receipt_path)
          files, identity = receipt.get("files"), receipt.get("identity")
          require(isinstance(files, dict) and isinstance(identity, dict) and is_digest(identity.get("build_key")),
                  "the candidate receipt lacks its file inventory or build identity")
          binary = files.get(executable)
          require(is_digest(binary) and digest(candidate / executable) == binary,
                  "the candidate executable differs from its build receipt")
          receipt_sha256 = digest(receipt_path)

          aggregate_path, worker_path = proof / "qualification.json", proof / "worker" / "qualification.json"
          aggregate, worker = load(aggregate_path), load(worker_path)
          for report in (aggregate, worker):
              require(report.get("passed") is True and report.get("published") is False
                      and report.get("target") == target and report.get("binary_sha256") == binary
                      and report.get("build_receipt_sha256") == receipt_sha256
                      and report.get("build_identity") == identity and report.get("candidate_files") == files,
                      "the qualification is not bound to this candidate")
          require(aggregate.get("worker_report_sha256") == digest(worker_path),
                  "the aggregate qualification names a different worker report")

          checks = load(release / "checksums.json")
          archive_name = checks.get("archive")
          require(isinstance(archive_name, str) and Path(archive_name).name == archive_name,
                  "the package names no single archive file")
          archive_sha256 = digest(release / archive_name)
          manifest_sha256 = checks.get("manifest_sha256")
          require(checks.get("published") is False and checks.get("target") == target
                  and checks.get("archive_sha256") == archive_sha256 and is_digest(manifest_sha256)
                  and checks.get("build_receipt_sha256") == receipt_sha256
                  and checks.get("qualification_sha256") == digest(aggregate_path)
                  and checks.get("build_identity") == identity
                  and isinstance(checks.get("files"), dict) and checks["files"].get(executable) == binary,
                  "the package is not bound to this candidate and qualification")

          installed_path, installed_worker_path = installed / "installed-proof.json", installed / "worker" / "report.json"
          final, final_worker = load(installed_path), load(installed_worker_path)
          for report in (final, final_worker):
              require(report.get("passed") is True and report.get("published") is False
                      and report.get("target") == target and report.get("archive_sha256") == archive_sha256
                      and report.get("manifest_sha256") == manifest_sha256,
                      "the installed proof did not use this archive")
          cache = final_worker.get("cache_files")
          require(final.get("worker_report_sha256") == digest(installed_worker_path)
                  and final_worker.get("binary_sha256") == binary
                  and final_worker.get("distribution_source") == "local-archive"
                  and isinstance(cache, dict) and isinstance(cache.get(executable), dict)
                  and cache[executable].get("sha256") == binary,
                  "the installed executable is not the candidate executable")

          qualified, repeated = proof_cases(aggregate), proof_cases(final)
          require(qualified == repeated, "the installed proofs differ from the qualification")
          required = {"selection": 9, "async": 15, "history": 1, "context": 8, "modernbert": 6}
          if target == "linux-x64":
              required["sandbox"] = 1
          require(qualified == required,
                  "the full proof set including the eight context cases is required")

          record = {
              "schema": "bello.native-ci-source-binding.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "source_sha": source,
              "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF", ""),
              "run_id": int(run_id),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "job": os.environ["GITHUB_JOB"],
              "runner_os": os.environ["RUNNER_OS"],
              "runner_image": os.environ.get("ImageVersion", ""),
              "python": platform.python_version(),
              "target": target,
              "candidate_artifact": artifact,
              "build_key": identity["build_key"],
              "build_receipt_sha256": receipt_sha256,
              "binary_sha256": binary,
              "qualification_sha256": digest(aggregate_path),
              "worker_qualification_sha256": digest(worker_path),
              "archive": archive_name,
              "archive_sha256": archive_sha256,
              "manifest_sha256": manifest_sha256,
              "installed_proof_sha256": digest(installed_path),
              "installed_worker_report_sha256": digest(installed_worker_path),
              "proof_cases": qualified,
              "published": False,
          }
          binding.parent.mkdir(parents=True, exist_ok=True)
          with binding.open("x", encoding="utf-8", newline="\n") as stream:
              stream.write(json.dumps(record, indent=2, sort_keys=True) + "\n")
          print(json.dumps({"bound": True, "source_sha": source, "target": target,
                            "binary_sha256": binary, "archive_sha256": archive_sha256}))
      - name: Preserve qualified archive and its checksums without publishing
        uses: actions/upload-artifact@v4
        with:
          name: native-codex-release-0161-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-release/*.tar.gz
            ${{ runner.temp }}/native-release/checksums.json
            ${{ runner.temp }}/native-release/bundle/selection-manifest.json
            ${{ runner.temp }}/native-release/bundle/BUILD-INFO
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve bounded synthetic receipts even when proof fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-codex-candidate-0161-${{ matrix.os }}-py${{ matrix.python }}-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-candidate/native-build-receipt.json
            native-candidate/BUILD-INFO
            native-candidate-tests.xml
            candidate-proof/qualification.json
            candidate-proof/worker/qualification.json
            candidate-proof/worker/*/report.json
            candidate-proof/worker/*/*/result.json
            candidate-proof/worker/context/*/receipt.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve bounded installed-proof receipts and the source binding even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-codex-installed-proof-0161-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-receipts/source-binding.json
            ${{ runner.temp }}/release-receipts/installed/installed-proof.json
            ${{ runner.temp }}/release-receipts/installed/worker/report.json
            ${{ runner.temp }}/release-receipts/installed/worker/*/report.json
            ${{ runner.temp }}/release-receipts/installed/worker/*/*/result.json
            ${{ runner.temp }}/release-receipts/installed/worker/context/*/receipt.json
          if-no-files-found: warn
          retention-days: 14
