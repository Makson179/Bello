name: Native Codex 0.161 candidate qualification

on:
  push:
    branches: ['codex/072-recovery-validation']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-codex-candidate-0161-${{ github.ref }}
  cancel-in-progress: false

# CI-only candidate: no release upload, installer pin, or provider credentials.
# Ready binaries and Cargo state use exact, candidate-only input identities.
jobs:
  linux-build:
    if: github.ref == 'refs/heads/codex/072-recovery-validation'
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    outputs:
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Identify exact 0.161 candidate build inputs
        id: identity
        run: |
          key=$(python scripts/build_native_codex_candidate.py build-key --target linux-x64)
          [[ "$key" =~ ^[0-9a-f]{64}$ ]]
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "artifact-name=native-codex-candidate-0161-linux-x64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: candidate
        with:
          path: native-candidate
          key: native-codex-candidate-0161-linux-x64-ready-v1-${{ steps.identity.outputs.key }}
      - name: Validate exact cached receipt and every binary before reuse
        if: steps.candidate.outputs.cache-hit == 'true'
        run: python scripts/build_native_codex_candidate.py verify-build --target linux-x64 --candidate native-candidate
      - name: Configure isolated native build paths
        if: steps.candidate.outputs.cache-hit != 'true'
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/bello-candidate-0161-target" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/bello-candidate-0161-cargo" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: steps.candidate.outputs.cache-hit != 'true'
        with:
          repository: openai/codex
          ref: 979011409de0a60b52f179721948e65531d26144
          path: native-source
          persist-credentials: false
      - name: Install Linux native build dependencies
        if: steps.candidate.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends binutils pkg-config libcap-dev libssl-dev clang cmake
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        if: steps.candidate.outputs.cache-hit != 'true'
        with:
          toolchain: '1.95.0'
          targets: x86_64-unknown-linux-gnu
      - uses: actions/cache/restore@v4
        if: steps.candidate.outputs.cache-hit != 'true'
        id: cargo_cache
        with:
          path: |
            ${{ runner.temp }}/bello-candidate-0161-cargo/registry
            ${{ runner.temp }}/bello-candidate-0161-cargo/git
            ${{ runner.temp }}/bello-candidate-0161-target
          key: native-codex-candidate-0161-linux-x64-cargo-v1-${{ steps.identity.outputs.key }}
          # Cargo revalidates changed source; ready binaries never use fallback.
          restore-keys: native-codex-candidate-0161-linux-x64-cargo-v1-
      - name: Apply only the pinned 0.161 candidate patch
        if: steps.candidate.outputs.cache-hit != 'true'
        run: python scripts/prepare_native_codex_candidate.py prepare --source native-source
      - name: Download and verify pinned V8 v150.4 artifacts
        if: steps.candidate.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bello-candidate-0161-v8"
          base=https://github.com/openai/codex/releases/download/rusty-v8-v150.4.0
          archive=librusty_v8_ptrcomp_sandbox_release_x86_64-unknown-linux-gnu.a.gz
          binding=src_binding_ptrcomp_sandbox_release_x86_64-unknown-linux-gnu.rs
          for name in "$archive" "$binding"; do
            curl --fail --location --retry 3 "$base/$name" -o "$RUNNER_TEMP/bello-candidate-0161-v8/$name"
          done
          python scripts/prepare_native_codex_linux.py verify-v8 --directory "$RUNNER_TEMP/bello-candidate-0161-v8"
          echo "RUSTY_V8_ARCHIVE=$RUNNER_TEMP/bello-candidate-0161-v8/$archive" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=$RUNNER_TEMP/bello-candidate-0161-v8/$binding" >> "$GITHUB_ENV"
      - name: Finalize bwrap before compiling its digest into Codex
        if: steps.candidate.outputs.cache-hit != 'true'
        working-directory: native-source/codex-rs
        run: |
          cargo build --locked --release --timings --target x86_64-unknown-linux-gnu --bin bwrap
          bwrap="$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap"
          digest=$(sha256sum "$bwrap" | cut -d ' ' -f 1)
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          echo "CODEX_BWRAP_SHA256=$digest" >> "$GITHUB_ENV"
      - name: Compile native Codex and code-mode host
        if: steps.candidate.outputs.cache-hit != 'true'
        working-directory: native-source/codex-rs
        run: cargo build --locked --release --timings --target x86_64-unknown-linux-gnu --bin codex --bin codex-code-mode-host
      - name: Test native path URI conversions before snapshotting the candidate
        if: steps.candidate.outputs.cache-hit != 'true'
        working-directory: native-source/codex-rs
        run: cargo test --locked --release --target x86_64-unknown-linux-gnu -p codex-utils-path-uri --lib
      - name: Preserve the exact successful Cargo build
        if: steps.candidate.outputs.cache-hit != 'true' && steps.cargo_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/bello-candidate-0161-cargo/registry
            ${{ runner.temp }}/bello-candidate-0161-cargo/git
            ${{ runner.temp }}/bello-candidate-0161-target
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}
      - name: Snapshot all binaries and immutable build receipt independently of proof
        if: steps.candidate.outputs.cache-hit != 'true'
        run: python scripts/build_native_codex_candidate.py snapshot-build --target linux-x64 --source native-source --release "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release" --cargo-home "$CARGO_HOME" --output native-candidate
      - name: Verify every candidate file and exact build identity
        run: python scripts/build_native_codex_candidate.py verify-build --target linux-x64 --candidate native-candidate
      - name: Preserve exact verified candidate cache
        if: steps.candidate.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: native-candidate
          key: ${{ steps.candidate.outputs.cache-primary-key }}
      - name: Preserve CI-only binaries before proof jobs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: native-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows-build:
    if: github.ref == 'refs/heads/codex/072-recovery-validation'
    runs-on: windows-2025
    timeout-minutes: 240
    outputs:
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Identify exact 0.161 candidate build inputs
        id: identity
        run: |
          $key = python scripts/build_native_codex_candidate.py build-key --target windows-x64
          if ($LASTEXITCODE -ne 0 -or $key -notmatch '^[0-9a-f]{64}$') { throw 'Invalid candidate build identity' }
          "key=$key" >> $env:GITHUB_OUTPUT
          "artifact-name=native-codex-candidate-0161-windows-x64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v4
        id: candidate
        with:
          path: native-candidate
          key: native-codex-candidate-0161-windows-x64-ready-v1-${{ steps.identity.outputs.key }}
      - name: Validate exact cached receipt and every binary before reuse
        if: steps.candidate.outputs.cache-hit == 'true'
        run: python scripts/build_native_codex_candidate.py verify-build --target windows-x64 --candidate native-candidate
      - name: Configure isolated native build paths
        if: steps.candidate.outputs.cache-hit != 'true'
        run: |
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'bello-candidate-0161-target')" >> $env:GITHUB_ENV
          "CARGO_HOME=$(Join-Path $env:RUNNER_TEMP 'bello-candidate-0161-cargo')" >> $env:GITHUB_ENV
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        if: steps.candidate.outputs.cache-hit != 'true'
        with:
          repository: openai/codex
          ref: 979011409de0a60b52f179721948e65531d26144
          path: native-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        if: steps.candidate.outputs.cache-hit != 'true'
        with:
          toolchain: '1.95.0'
          targets: x86_64-pc-windows-msvc
      - uses: ./native-source/.github/actions/setup-msvc-env
        if: steps.candidate.outputs.cache-hit != 'true'
        with:
          target: x86_64-pc-windows-msvc
      - uses: actions/cache/restore@v4
        if: steps.candidate.outputs.cache-hit != 'true'
        id: cargo_cache
        with:
          path: |
            ${{ runner.temp }}/bello-candidate-0161-cargo/registry
            ${{ runner.temp }}/bello-candidate-0161-cargo/git
            ${{ runner.temp }}/bello-candidate-0161-target
          key: native-codex-candidate-0161-windows-x64-cargo-v1-${{ steps.identity.outputs.key }}
          # Cargo revalidates changed source; ready binaries never use fallback.
          restore-keys: native-codex-candidate-0161-windows-x64-cargo-v1-
      - name: Apply only the pinned 0.161 candidate patch
        if: steps.candidate.outputs.cache-hit != 'true'
        run: python scripts/prepare_native_codex_candidate.py prepare --source native-source
      - name: Download and verify pinned V8 v150.4 artifacts
        if: steps.candidate.outputs.cache-hit != 'true'
        run: |
          $v8 = Join-Path $env:RUNNER_TEMP 'bello-candidate-0161-v8'
          New-Item -ItemType Directory -Path $v8 -Force | Out-Null
          $base = 'https://github.com/openai/codex/releases/download/rusty-v8-v150.4.0'
          $archive = 'rusty_v8_ptrcomp_sandbox_release_x86_64-pc-windows-msvc.lib.gz'
          $binding = 'src_binding_ptrcomp_sandbox_release_x86_64-pc-windows-msvc.rs'
          foreach ($name in @($archive, $binding)) {
            Invoke-WebRequest "$base/$name" -OutFile (Join-Path $v8 $name)
          }
          python scripts/prepare_native_codex_windows.py verify-v8 --directory $v8
          if ($LASTEXITCODE -ne 0) { throw 'Pinned V8 verification failed' }
          "RUSTY_V8_ARCHIVE=$(Join-Path $v8 $archive)" >> $env:GITHUB_ENV
          "RUSTY_V8_SRC_BINDING_PATH=$(Join-Path $v8 $binding)" >> $env:GITHUB_ENV
      - name: Compile all four native Windows executables
        if: steps.candidate.outputs.cache-hit != 'true'
        working-directory: native-source/codex-rs
        run: cargo build --locked --release --timings --target x86_64-pc-windows-msvc --bin codex --bin codex-code-mode-host --bin codex-command-runner --bin codex-windows-sandbox-setup
      - name: Test native Windows drive-root URI roundtrips before snapshotting the candidate
        if: steps.candidate.outputs.cache-hit != 'true'
        working-directory: native-source/codex-rs
        run: cargo test --locked --release --target x86_64-pc-windows-msvc -p codex-utils-path-uri --lib
      - name: Preserve the exact successful Cargo build
        if: steps.candidate.outputs.cache-hit != 'true' && steps.cargo_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/bello-candidate-0161-cargo/registry
            ${{ runner.temp }}/bello-candidate-0161-cargo/git
            ${{ runner.temp }}/bello-candidate-0161-target
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}
      - name: Snapshot all binaries and immutable build receipt independently of proof
        if: steps.candidate.outputs.cache-hit != 'true'
        run: python scripts/build_native_codex_candidate.py snapshot-build --target windows-x64 --source native-source --release "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release" --cargo-home "$env:CARGO_HOME" --output native-candidate
      - name: Verify every candidate file and exact build identity
        run: python scripts/build_native_codex_candidate.py verify-build --target windows-x64 --candidate native-candidate
      - name: Preserve exact verified candidate cache
        if: steps.candidate.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: native-candidate
          key: ${{ steps.candidate.outputs.cache-primary-key }}
      - name: Preserve CI-only binaries before proof jobs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: native-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux-proof:
    if: github.ref == 'refs/heads/codex/072-recovery-validation'
    needs: linux-build
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.linux-build.outputs.artifact-name }}
          path: native-candidate
      - name: Verify all receipt hashes before restoring executable modes
        run: python scripts/build_native_codex_candidate.py verify-build --target linux-x64 --candidate native-candidate --restore-executable-modes
      - name: Install CPU inference and local proof dependencies
        run: |
          python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[log-distiller,test]"
      - name: Validate build, qualifier and branch routing contracts
        run: python -m pytest -q tests/test_native_codex_candidate.py tests/test_build_native_codex_candidate.py tests/test_verify_native_codex_candidate.py tests/test_native_codex_candidate_workflow.py --junitxml=native-candidate-tests.xml
      - name: Qualify selection, async concurrency, history, Linux sandbox and six real CPU ModernBERT cases
        run: python scripts/verify_native_codex_candidate.py --candidate native-candidate --target linux-x64 --output-dir candidate-proof --modernbert
      - name: Preserve bounded synthetic receipts even when proof fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-codex-candidate-0161-linux-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-candidate/native-build-receipt.json
            native-candidate/BUILD-INFO
            native-candidate-tests.xml
            candidate-proof/qualification.json
            candidate-proof/worker/qualification.json
            candidate-proof/worker/*/report.json
            candidate-proof/worker/*/*/result.json
          if-no-files-found: warn
          retention-days: 14

  windows-proof:
    if: github.ref == 'refs/heads/codex/072-recovery-validation'
    needs: windows-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            python: '3.11'
          - os: windows-2025
            python: '3.14'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-build.outputs.artifact-name }}
          path: native-candidate
      - name: Verify all receipt hashes before executing any candidate
        run: python scripts/build_native_codex_candidate.py verify-build --target windows-x64 --candidate native-candidate
      - name: Install CPU inference and local proof dependencies
        run: |
          python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e ".[log-distiller,test]"
          exit $LASTEXITCODE
      - name: Validate build, qualifier and branch routing contracts
        run: python -m pytest -q tests/test_native_codex_candidate.py tests/test_build_native_codex_candidate.py tests/test_verify_native_codex_candidate.py tests/test_native_codex_candidate_workflow.py --junitxml=native-candidate-tests.xml
      - name: Qualify selection, async concurrency, history and six real CPU ModernBERT cases
        run: python scripts/verify_native_codex_candidate.py --candidate native-candidate --target windows-x64 --output-dir candidate-proof --modernbert
      - name: Preserve bounded synthetic receipts even when proof fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-codex-candidate-0161-${{ matrix.os }}-py${{ matrix.python }}-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-candidate/native-build-receipt.json
            native-candidate/BUILD-INFO
            native-candidate-tests.xml
            candidate-proof/qualification.json
            candidate-proof/worker/qualification.json
            candidate-proof/worker/*/report.json
            candidate-proof/worker/*/*/result.json
          if-no-files-found: warn
          retention-days: 14
