name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing published release whose tag exactly matches the selected main commit (for example v0.7.2)"
        required: true
        type: string

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    # Native assets and explicitly GitHub-only releases must not publish to PyPI.
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !contains(github.event.release.body, '<!-- bello:github-only -->')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine packaging
      - name: Verify release version and exact main-integrated source
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import tomllib
          from packaging.version import Version

          tag = os.environ["RELEASE_TAG"]
          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} does not match package version {version!r}; expected {expected!r}")
          prerelease = Version(version).is_prerelease
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              if os.environ["GITHUB_REF"] != "refs/heads/main":
                  raise SystemExit("manual publication is allowed only from main")
              release = json.loads(subprocess.check_output([
                  "gh", "release", "view", tag, "--repo", os.environ["GITHUB_REPOSITORY"],
                  "--json", "isDraft,isPrerelease,body",
              ], text=True))
              if release["isDraft"] or release["isPrerelease"] != prerelease:
                  raise SystemExit("published release state does not match package version")
              if "<!-- bello:github-only -->" in release["body"]:
                  raise SystemExit("GitHub-only release is not authorized for package publication")
          tagged_commit = subprocess.check_output([
              "git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}",
          ], text=True).strip()
          source_sha = subprocess.check_output([
              "git", "rev-parse", "--verify", "HEAD^{commit}",
          ], text=True).strip()
          if tagged_commit != source_sha:
              raise SystemExit("checked-out source must exactly match the release tag commit")
          main_commit = subprocess.check_output([
              "git", "rev-parse", "--verify", "refs/remotes/origin/main^{commit}",
          ], text=True).strip()
          subprocess.run(["git", "merge-base", "--is-ancestor", tagged_commit, main_commit], check=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"prerelease={str(prerelease).lower()}\nsource_sha={source_sha}\n")
          print(f"Building {tag} from commit {source_sha}")
          PY
      - name: Build
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Verify prompt package data
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          expected = "supervisor/prompts/prompts.toml"
          if expected not in names:
              raise SystemExit(f"{expected} missing from {wheels[0]}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist-portable
          path: dist/*

  build-windows:
    name: Build Windows wheel with restricted sandbox
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Build platform wheel
        run: python -m build --wheel
      - name: Check metadata and mandatory native assets
        shell: pwsh
        run: |
          python -m twine check dist/*
          @'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*-py3-none-win_amd64.whl"))
          if len(wheels) != 1:
              raise SystemExit("expected exactly one Windows-specific wheel")
          with ZipFile(wheels[0]) as wheel:
              names = [name for name in wheel.namelist() if not name.endswith("/")]
              metadata = [name for name in names if name.endswith(".dist-info/WHEEL")]
              if len(metadata) != 1:
                  raise SystemExit("expected exactly one wheel metadata file")
              data_root = metadata[0].removesuffix(".dist-info/WHEEL") + ".data/"
              library_roots = (data_root + "purelib/", data_root + "platlib/")
              installed = {}
              for name in names:
                  relative = next((name[len(root):] for root in library_roots if name.startswith(root)), name)
                  if relative in installed:
                      raise SystemExit(f"duplicate installed wheel path: {relative}")
                  installed[relative] = name
              for required in (
                  "supervisor/runtime/bin/bello-windows-sandbox.exe",
                  "supervisor/runtime/bin/THIRD_PARTY_NOTICES.txt",
                  "supervisor/pi_worker/package-lock.json",
                  "supervisor/prompts/prompts.toml",
              ):
                  if required not in installed or not wheel.read(installed[required]):
                      raise SystemExit(f"missing or empty Windows wheel asset: {required}")
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*.whl

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, build-windows]
    if: needs.build.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [build, build-windows]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
