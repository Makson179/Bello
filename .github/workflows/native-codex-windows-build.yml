name: Native Codex Windows build

on:
  workflow_call:
    outputs:
      artifact-name:
        description: CI-only native build candidate; not a verified release
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    # Release executables and scoped test harnesses have separate compile costs.
    timeout-minutes: 240
    outputs:
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Identify native inputs independently of Python checks
        id: identity
        run: |
          $key = python scripts/prepare_native_codex_windows.py build-key
          if ($LASTEXITCODE -ne 0 -or $key -notmatch '^[0-9a-f]{64}$') { throw 'Invalid native build identity' }
          "key=$key" >> $env:GITHUB_OUTPUT
          "artifact-name=bello-native-windows-candidate-${{ github.run_id }}-${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT
      # Exact match only: a candidate from different native inputs is not usable.
      - uses: actions/cache/restore@v4
        id: candidate
        with:
          path: native-candidate
          key: native-codex-windows-ready-v1-${{ steps.identity.outputs.key }}
      - name: Verify cached candidate before reuse
        if: steps.candidate.outputs.cache-hit == 'true'
        run: python scripts/build_native_codex_windows.py verify-build --candidate native-candidate
      - name: Configure native build paths
        if: steps.candidate.outputs.cache-hit != 'true'
        run: |
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'bello-native-target')" >> $env:GITHUB_ENV
          "CARGO_HOME=$(Join-Path $env:RUNNER_TEMP 'bello-cargo')" >> $env:GITHUB_ENV
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        if: steps.candidate.outputs.cache-hit != 'true'
        with:
          repository: openai/codex
          ref: be2951ea34f0d295ed0becf97079f92fa5f6950e
          path: native-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        if: steps.candidate.outputs.cache-hit != 'true'
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./native-source/.github/actions/setup-msvc-env
        if: steps.candidate.outputs.cache-hit != 'true'
        with:
          target: x86_64-pc-windows-msvc
      - uses: actions/cache/restore@v4
        if: steps.candidate.outputs.cache-hit != 'true'
        id: cargo_cache
        with:
          path: |
            ${{ runner.temp }}/bello-cargo/registry
            ${{ runner.temp }}/bello-cargo/git
            ${{ runner.temp }}/bello-native-target
          key: native-codex-windows-1.95.0-v1-${{ steps.identity.outputs.key }}
          restore-keys: native-codex-windows-1.95.0-v1-
      - name: Prepare exact upstream source and patch
        if: steps.candidate.outputs.cache-hit != 'true'
        run: python scripts/prepare_native_codex_windows.py prepare --source native-source --patch scripts/native-codex-selection.patch
      - name: Download checksum-pinned upstream V8 library and bindings
        if: steps.candidate.outputs.cache-hit != 'true'
        run: |
          $v8 = Join-Path $env:RUNNER_TEMP 'bello-v8'
          New-Item -ItemType Directory -Path $v8 -Force | Out-Null
          $base = 'https://github.com/openai/codex/releases/download/rusty-v8-v150.4.0'
          $archive = 'rusty_v8_ptrcomp_sandbox_release_x86_64-pc-windows-msvc.lib.gz'
          $binding = 'src_binding_ptrcomp_sandbox_release_x86_64-pc-windows-msvc.rs'
          foreach ($name in @($archive, $binding)) {
            Invoke-WebRequest "$base/$name" -OutFile (Join-Path $v8 $name)
          }
          python scripts/prepare_native_codex_windows.py verify-v8 --directory $v8
          if ($LASTEXITCODE -ne 0) { throw 'Pinned V8 verification failed' }
          "RUSTY_V8_ARCHIVE=$(Join-Path $v8 $archive)" >> $env:GITHUB_ENV
          "RUSTY_V8_SRC_BINDING_PATH=$(Join-Path $v8 $binding)" >> $env:GITHUB_ENV
      - name: Install pinned upstream native test runners
        if: steps.candidate.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0,nextest@0.9.103
      - name: Verify native test runner paths and versions before compiling
        if: steps.candidate.outputs.cache-hit != 'true'
        run: |
          $cargoBin = Join-Path $env:CARGO_HOME 'bin'
          $cargoBin >> $env:GITHUB_PATH
          $env:PATH = "$cargoBin;$env:PATH"
          $justVersion = just --version
          if ($LASTEXITCODE -ne 0 -or $justVersion -ne 'just 1.51.0') { throw 'Pinned just unavailable' }
          $nextestVersion = @(cargo nextest --version)
          if ($LASTEXITCODE -ne 0 -or $nextestVersion.Count -lt 1 -or $nextestVersion[0] -notmatch '^cargo-nextest 0\.9\.103(?:\s|$)') { throw 'Pinned nextest unavailable' }
          Write-Output $justVersion
          Write-Output $nextestVersion
      - name: Build four native Windows executables
        id: native_compile
        if: steps.candidate.outputs.cache-hit != 'true'
        working-directory: native-source/codex-rs
        run: cargo build --locked --release --timings --target x86_64-pc-windows-msvc --bin codex --bin codex-code-mode-host --bin codex-command-runner --bin codex-windows-sandbox-setup
      # Cargo validates these intermediates again; they are never a ready candidate.
      - name: Preserve reusable Cargo intermediates after compile success or failure
        if: ${{ !cancelled() && (steps.native_compile.outcome == 'success' || steps.native_compile.outcome == 'failure') && steps.candidate.outputs.cache-hit != 'true' && steps.cargo_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/bello-cargo/registry
            ${{ runner.temp }}/bello-cargo/git
            ${{ runner.temp }}/bello-native-target
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}
      - name: Test setup transactions and report compatibility before caching candidate
        if: steps.candidate.outputs.cache-hit != 'true'
        working-directory: native-source/codex-rs
        run: |
          $env:PATH = "$(Join-Path $env:CARGO_HOME 'bin');$env:PATH"
          $reports = Join-Path $env:GITHUB_WORKSPACE 'native-setup-test-reports'
          New-Item -ItemType Directory -Path $reports -Force | Out-Null
          # Nextest 0.9.103 stores reports relative to its workspace, not CARGO_TARGET_DIR.
          $junit = Join-Path (Get-Location).Path 'target/nextest/local/junit.xml'
          if (Test-Path -LiteralPath $junit) { Remove-Item -LiteralPath $junit -ErrorAction Stop }
          just test --locked --release --target x86_64-pc-windows-msvc -p codex-windows-sandbox --lib --bin codex-windows-sandbox-setup --test-threads 1 --retries 0 -E 'test(setup_transaction::tests::) | test(report_helper_failure_) | test(setup_version_rejects_) | test(setup_payload_requires_) | test(detached_read_acl_payload_) | test(setup_launch::tests::) | test(win::acl_tests::)'
          $setupExit = $LASTEXITCODE
          if (Test-Path -LiteralPath $junit -PathType Leaf) { Copy-Item -LiteralPath $junit -Destination (Join-Path $reports 'setup-transactions.xml') -ErrorAction Stop }
          if ($setupExit -ne 0) { throw "Setup transaction regressions failed: $setupExit" }
          if (-not (Test-Path -LiteralPath $junit -PathType Leaf)) { throw 'Setup transaction regressions did not produce JUnit' }
          Remove-Item -LiteralPath $junit -ErrorAction Stop
          just test --locked --release --target x86_64-pc-windows-msvc -p codex-cli --bin codex --test-threads 1 --retries 0 -E 'test(reports_refresh_failure_after_setup_completed) | test(rejects_oversized_setup_failure_reports) | test(reports_setup_transaction_lock_failure_without_reset)'
          $doctorExit = $LASTEXITCODE
          if (Test-Path -LiteralPath $junit -PathType Leaf) { Copy-Item -LiteralPath $junit -Destination (Join-Path $reports 'doctor-report-compatibility.xml') -ErrorAction Stop }
          if ($doctorExit -ne 0) { throw "Doctor report compatibility regressions failed: $doctorExit" }
          if (-not (Test-Path -LiteralPath $junit -PathType Leaf)) { throw 'Doctor report compatibility regressions did not produce JUnit' }
      - name: Preserve native setup regression receipts
        if: always() && steps.candidate.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-setup-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-setup-test-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Save compiled executables independently of provider proof success
        if: steps.candidate.outputs.cache-hit != 'true'
        run: python scripts/build_native_codex_windows.py snapshot-build --source native-source --patch scripts/native-codex-selection.patch --release "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release" --cargo-home "$env:CARGO_HOME" --output native-candidate
      - name: Validate exact native inputs and every candidate file
        run: python scripts/build_native_codex_windows.py verify-build --candidate native-candidate
      - name: Cache ready executables for Python-only changes
        if: steps.candidate.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: native-candidate
          key: ${{ steps.candidate.outputs.cache-primary-key }}
      # Saved before proof starts, so failed tests can be rerun without building.
      # A candidate is never an automatic-download pin or a public release.
      - name: Upload CI-only build candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: native-candidate/
          if-no-files-found: error
          retention-days: 14
